name: Sync OpenAI vector store

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/sync-openai-vector-store.mjs"
      - ".github/workflows/sync-openai-vector-store.yml"
      - "package.json"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VECTOR_STORE_ID: ${{ secrets.OPENAI_VECTOR_STORE_ID }}
      OPENAI_ORGANIZATION_ID: ${{ secrets.OPENAI_ORGANIZATION_ID }}
      OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
      OPENAI_SYNC_DELETE_FILES: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync docs to OpenAI vector store
        run: node scripts/sync-openai-vector-store.mjs
